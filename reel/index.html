    <style>
      @font-face {
        font-family: "IBM Plex Sans Arabic";
        font-weight: 400;
        src: url("./assets/fonts/ibm-plex-sans-arabic-arabic-400-normal.woff2") format("woff2");

      @font-face {

        src: url("./assets/fonts/ibm-plex-sans-arabic-arabic-500-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "IBM Plex Sans Arabic";
        font-weight: 700;
        src: url("./assets/fonts/ibm-plex-sans-arabic-arabic-700-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Archivo";
        font-weight: 500;
        src: url("./assets/fonts/archivo-latin-500-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Archivo";
        font-weight: 800;
        src: url("./assets/fonts/archivo-latin-800-normal.woff2") format("woff2");
      }

      :root {
        --navy-900: #04121f;
        --navy-800: #061a2e;
        --navy-700: #0a2742;
        --blue-500: #3da9ff;
        --blue-300: #63c7ff;
        --ink: #f5f8fc;
        --muted: #a9bed3;
      }

      body {
        margin: 0;
        background: var(--navy-900);
        color: var(--ink);
        font-family: "IBM Plex Sans Arabic", sans-serif;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #020509;
      }

      /* ---------- 3D layer ---------- */
      #car3d {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      /* ---------- grade / atmosphere ---------- */
      .grade {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #vignette {
        background: radial-gradient(120% 75% at 50% 58%, rgba(0, 0, 0, 0) 45%, rgba(2, 6, 12, 0.85) 100%);
      }
      #topfade {
        background: linear-gradient(180deg, rgba(3, 10, 20, 0.92) 0%, rgba(3, 10, 20, 0.55) 26%, rgba(3, 10, 20, 0) 44%);
      }
      #bottomfade {
        background: linear-gradient(0deg, rgba(2, 6, 12, 0.95) 0%, rgba(2, 6, 12, 0.35) 16%, rgba(2, 6, 12, 0) 30%);
      }
      #beam {
        background: radial-gradient(38% 46% at 50% 30%, rgba(99, 199, 255, 0.16) 0%, rgba(61, 169, 255, 0.05) 45%, rgba(0, 0, 0, 0) 75%);
        mix-blend-mode: screen;
        opacity: 0;
      }
      #haze {
        background: linear-gradient(180deg, rgba(0, 0, 0, 0) 52%, rgba(99, 199, 255, 0.07) 70%, rgba(0, 0, 0, 0) 86%);
        mix-blend-mode: screen;
      }

      /* ---------- typography ---------- */
      .scene {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .copy {
        position: absolute;
        top: 236px;
        right: 92px;
        left: 92px;
        direction: rtl;
        text-align: right;
      }
      .kicker {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 18px;
        margin-bottom: 30px;
        direction: ltr;
        flex-direction: row-reverse;
        font-family: "Archivo", sans-serif;
        font-weight: 500;
        font-size: 24px;
        letter-spacing: 0.3em;
        color: var(--blue-300);
      }
      .kicker .bar {
        width: 64px;
        height: 2px;
        background: var(--blue-300);
        transform-origin: 100% 50%;
      }
      .kicker .latin {
        display: block;
      }
      .kicker b {
        font-weight: 800;
        color: var(--ink);
      }
      .title {
        display: block;
        margin: 0;
        font-weight: 700;
        font-size: 100px;
        line-height: 1.22;
        color: var(--ink);
        text-shadow: 0 6px 40px rgba(0, 0, 0, 0.55);
      }
      .title .accent {
        color: var(--blue-300);
      }
      .sub {
        display: block;
        margin-top: 22px;
        font-weight: 400;
        font-size: 48px;
        line-height: 1.45;
        color: var(--muted);
      }
      .rule {
        display: block;
        width: 260px;
        height: 3px;
        margin: 34px 0 0 auto;
        background: linear-gradient(270deg, var(--blue-300), rgba(61, 169, 255, 0));
        transform-origin: 100% 50%;
        box-shadow: 0 0 18px rgba(99, 199, 255, 0.6);
      }

      /* ---------- swatches (scene 3) ---------- */
      .swatches {
        position: relative;
        display: flex;
        direction: rtl;
        gap: 30px;
        margin-top: 46px;
        width: max-content;
        margin-left: auto;
      }
      .sw {
        display: block;
        width: 58px;
        height: 58px;
        border-radius: 50%;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.22), 0 8px 24px rgba(0, 0, 0, 0.5);
      }
      .sw-ring {
        position: absolute;
        top: -9px;
        right: -9px;
        width: 72px;
        height: 72px;
        border-radius: 50%;
        border: 2px solid var(--blue-300);
        box-shadow: 0 0 22px rgba(99, 199, 255, 0.75);
        box-sizing: border-box;
      }

      /* ---------- preview panel (scene 4) ---------- */
      #panel {
        position: absolute;
        left: 64px;
        right: 64px;
        top: 760px;
        height: 660px;
        border-radius: 28px;
        border: 1px solid rgba(99, 199, 255, 0.35);

      #panel .dots {
        position: absolute;

        left: 30px;

        gap: 12px;
        direction: ltr;

      #panel .dots i {

        width: 16px;
        height: 16px;

      #panel .brandtag {

        right: 34px;

      #panel .scan {

      #panel .mini {

      }
      #panel .mini .sw.on {
        box-shadow: 0 0 0 3px var(--blue-300), 0 0 20px rgba(99, 199, 255, 0.8);
      }
      .corner {
        position: absolute;
        width: 46px;
        height: 46px;
        border-color: var(--blue-300);
        border-style: solid;
        border-width: 0;
      }
      .corner.tl { top: 744px; left: 48px; border-top-width: 3px; border-left-width: 3px; border-top-left-radius: 14px; }
      .corner.tr { top: 744px; right: 48px; border-top-width: 3px; border-right-width: 3px; border-top-right-radius: 14px; }
      .corner.bl { top: 1390px; left: 48px; border-bottom-width: 3px; border-left-width: 3px; border-bottom-left-radius: 14px; }
      .corner.br { top: 1390px; right: 48px; border-bottom-width: 3px; border-right-width: 3px; border-bottom-right-radius: 14px; }

      /* ---------- end card (scene 5) ---------- */
      #endcard .center {
        position: absolute;
        top: 300px;
        left: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .wordmark {
        display: block;
        direction: ltr;
        white-space: nowrap;
        font-family: "Archivo", sans-serif;
        font-weight: 800;
        font-size: 94px;
        letter-spacing: 0.14em;
        color: var(--ink);
        text-shadow: 0 0 40px rgba(99, 199, 255, 0.35);
      }
      .wordmark span {
        color: var(--blue-300);
        font-weight: 500;
      }
      .endline {
        display: block;
        width: 520px;
        height: 3px;
        margin-top: 30px;
        background: linear-gradient(90deg, rgba(99, 199, 255, 0), var(--blue-300) 50%, rgba(99, 199, 255, 0));
        box-shadow: 0 0 22px rgba(99, 199, 255, 0.8);
      }
      .tagline {
        display: block;
        margin-top: 38px;
        direction: rtl;
        font-weight: 500;
        font-size: 66px;
        line-height: 1.3;
        color: var(--ink);
        text-align: center;
      }
      .streak {
        position: absolute;
        top: 362px;
        width: 540px;
        height: 2px;
        background: linear-gradient(90deg, rgba(99, 199, 255, 0), var(--blue-300));
        box-shadow: 0 0 16px rgba(99, 199, 255, 0.9);
      }
      .streak.l { left: 0; }
      .streak.r { right: 0; background: linear-gradient(270deg, rgba(99, 199, 255, 0), var(--blue-300)); }

      /* ---------- transitions ---------- */
      #sweep {
        position: absolute;
        top: -200px;
        bottom: -200px;
        left: 190px;
        width: 700px;
        background: linear-gradient(90deg, rgba(99, 199, 255, 0) 0%, rgba(99, 199, 255, 0.35) 38%, rgba(245, 248, 252, 0.95) 50%, rgba(99, 199, 255, 0.35) 62%, rgba(99, 199, 255, 0) 100%);
        mix-blend-mode: screen;
        filter: blur(6px);
        pointer-events: none;
      }
      #flash {
        position: absolute;
        inset: 0;
        background: radial-gradient(70% 50% at 50% 55%, rgba(220, 242, 255, 0.9), rgba(99, 199, 255, 0.35) 55%, rgba(6, 26, 46, 0) 100%);
        opacity: 0;
        pointer-events: none;
      }
    </style>

  <body>

    <script>
      // ---------- HTML/typography timeline (global time, seconds) ----------
      const tl = gsap.timeline({ paused: true });
      const IN = "power3.out";
      const OUT = "power2.in";

      // RTL line reveal: wipes in from the right edge, Arabic shaping stays intact (whole lines, no letter splits)
      function revealLine(sel, at, dur = 0.9) {
        tl.fromTo(
          sel,
          { clipPath: "inset(-20% 0% -20% 100%)", x: 46, opacity: 0, filter: "blur(10px)" },
          { clipPath: "inset(-20% 0% -20% 0%)", x: 0, opacity: 1, filter: "blur(0px)", duration: dur, ease: IN },
          at,
        );
      }
      function drawRule(sel, at) {
        tl.fromTo(sel, { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "power2.inOut" }, at);
      }
      function exitGroup(sels, at) {
        tl.to(sels, { opacity: 0, y: -24, filter: "blur(8px)", duration: 0.4, ease: OUT, stagger: 0.04 }, at);
      }

      // Scene 1
      tl.fromTo("#beam", { opacity: 0 }, { opacity: 1, duration: 2.2, ease: "sine.inOut" }, 0.2);
      tl.to("#beam", { opacity: 0.35, duration: 1.5, ease: "sine.inOut" }, 3.0);
      tl.fromTo("#s1-kicker", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.8, ease: IN }, 0.35);
      drawRule("#s1-kicker .bar", 0.35);
      revealLine("#s1-t1", 0.6);
      revealLine("#s1-t2", 1.95);
      drawRule("#s1-rule", 2.2);
      exitGroup(["#s1-kicker", "#s1-t1", "#s1-t2", "#s1-rule"], 2.95);

      // Scene 2
      tl.fromTo("#s2-kicker", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.8, ease: IN }, 3.4);
      drawRule("#s2-kicker .bar", 3.4);
      revealLine("#s2-t1", 3.5);
      revealLine("#s2-sub", 4.6, 1.0);
      drawRule("#s2-rule", 4.9);
      exitGroup(["#s2-kicker", "#s2-t1", "#s2-sub", "#s2-rule"], 7.05);

      // Scene 3 — swatch ring follows the paint wipes (step = 58 px swatch + 30 px gap)
      revealLine("#s3-t1", 7.7);
      revealLine("#s3-t2", 8.05);
      tl.fromTo("#s3-swatches .sw", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.6)", stagger: 0.06 }, 8.1);
      tl.fromTo("#s3-ring", { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.45, ease: IN }, 8.35);
      [9.0, 10.1, 11.2, 12.3].forEach((t, i) => {
        tl.to("#s3-ring", { x: -(i + 1) * 88, duration: 0.55, ease: "power3.inOut" }, t - 0.15);
      });
      exitGroup(["#s3-t1", "#s3-t2", "#s3-swatches"], 12.75);

      // Scene 4 — preview panel + scan line synced with the 3D paint wipes
      tl.fromTo("#panel", { opacity: 0, scale: 0.94, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.7, ease: IN }, 13.25);
      tl.fromTo(".corner", { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: 0.6, ease: IN, stagger: 0.05 }, 13.3);
      revealLine("#s4-t1", 13.35);
      revealLine("#s4-sub", 14.1);
      tl.fromTo("#s4-mini", { opacity: 0, xPercent: -50, y: 16 }, { opacity: 1, xPercent: -50, y: 0, duration: 0.5, ease: IN }, 13.6);
      [
        [13.75, 14.55, "#s4-ice", "#s4-navy"],
        [14.95, 15.75, "#s4-navy", "#s4-ice"],
      ].forEach(([a, b, on, off]) => {
        tl.fromTo("#s4-scan", { x: 948, opacity: 0 }, { x: 0, duration: b - a, ease: "power1.inOut", immediateRender: false }, a);
        tl.to("#s4-scan", { opacity: 1, duration: 0.12 }, a);
        tl.to("#s4-scan", { opacity: 0, duration: 0.15 }, b - 0.12);
        tl.set(on, { className: "sw on" }, a + 0.1);
        tl.set(off, { className: "sw" }, a + 0.1);
      });
      exitGroup(["#s4-t1", "#s4-sub", "#panel", ".corner"], 15.6);

      // Scene 5 — streaks converge, wordmark + tagline
      tl.fromTo("#s5-sl", { x: -560, opacity: 1 }, { x: 0, duration: 0.55, ease: "power3.in" }, 16.0);
      tl.fromTo("#s5-sr", { x: 560, opacity: 1 }, { x: 0, duration: 0.55, ease: "power3.in" }, 16.0);
      tl.to(["#s5-sl", "#s5-sr"], { opacity: 0, duration: 0.25 }, 16.55);
      tl.fromTo(
        "#s5-mark",
        { opacity: 0, scale: 1.18, filter: "blur(14px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 1.1, ease: "expo.out" },
        16.45,
      );
      tl.fromTo("#s5-line", { scaleX: 0 }, { scaleX: 1, duration: 1.0, ease: "power2.inOut" }, 16.85);
      revealLine("#s5-tag", 17.9, 1.0);

      // Cut transitions: light sweep travels right→left (RTL), flash masks the camera cut
      [7.5, 13.2, 16.0].forEach((cut, i) => {
        const ir = i === 0 ? {} : { immediateRender: false };
        tl.fromTo("#sweep", { x: 1100, opacity: 1 }, { x: -1300, duration: 0.7, ease: "power2.inOut", ...ir }, cut - 0.35);
        tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.55, duration: 0.14, ease: "power2.in", ...ir }, cut - 0.14);
        tl.to("#flash", { opacity: 0, duration: 0.42, ease: "power2.out" }, cut);
      });

      window.__timelines["rek-ppf-reel"] = tl;
    </script>

    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";
      import { Reflector } from "three/addons/objects/Reflector.js";

      const W = 1080;
      const H = 1920;
      const CUT_B = 7.5;
      const CUT_C = 13.2;
      const CUT_D = 16.0;

      const canvas = document.getElementById("car3d");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H, false);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;
      renderer.outputColorSpace = THREE.SRGBColorSpace;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x020509);
      const camera = new THREE.PerspectiveCamera(42, W / H, 0.1, 200);

      // ---------- studio environment: emissive softboxes baked to PMREM ----------
      function buildStudioEnv() {
        const s = new THREE.Scene();
        s.background = new THREE.Color(0x000000);
        const box = (w, h, hex, k, pos, rot) => {
          const m = new THREE.Mesh(
            new THREE.PlaneGeometry(w, h),
            new THREE.MeshBasicMaterial({ color: new THREE.Color(hex).multiplyScalar(k), side: THREE.DoubleSide }),
          );
          m.position.set(...pos);
          m.rotation.set(...rot);
          s.add(m);
        };
        box(7, 2.6, 0xffffff, 3.0, [0, 7, 0], [Math.PI / 2, 0, 0]); // overhead softbox
        box(0.35, 11, 0xe3f4ff, 7.0, [2.4, 6.6, 0], [Math.PI / 2, 0, 0]); // long strip L
        box(0.35, 11, 0xe3f4ff, 7.0, [-2.4, 6.6, 0], [Math.PI / 2, 0, 0]); // long strip R
        box(11, 0.5, 0x63c7ff, 4.5, [8, 1.5, 0], [0, -Math.PI / 2, 0]); // side strip, brand light blue
        box(11, 0.5, 0x3da9ff, 3.5, [-8, 1.5, 0], [0, Math.PI / 2, 0]); // side strip, brand blue
        box(6, 1.1, 0xffffff, 2.6, [0, 1.9, -9], [0, 0, 0]); // rear rim
        box(6, 0.5, 0x9fd8ff, 1.3, [0, 0.9, 9], [0, Math.PI, 0]); // front low fill
        const pm = new THREE.PMREMGenerator(renderer);
        const tex = pm.fromScene(s, 0.015).texture;
        pm.dispose();
        return tex;
      }
      scene.environment = buildStudioEnv();
      scene.environmentIntensity = 0.0;

      // Moving key light: sweeps across the body during the reveal
      const sweepLight = new THREE.SpotLight(0xe6f6ff, 0, 40, 0.55, 0.85, 0);
      sweepLight.position.set(-7, 6, 3);
      sweepLight.target.position.set(0, 0.6, 0);
      scene.add(sweepLight, sweepLight.target);

      // ---------- floor: dark mirror + radial falloff + soft light pool ----------
      const floorGeo = new THREE.PlaneGeometry(40, 40);
      const mirror = new Reflector(floorGeo, {
        clipBias: 0.003,
        textureWidth: W,
        textureHeight: H,
        color: 0x1d2229,
        multisample: 0,
      });
      mirror.rotation.x = -Math.PI / 2;
      scene.add(mirror);

      function radialTexture(stops) {
        const c = document.createElement("canvas");
        c.width = c.height = 512;
        const g = c.getContext("2d");
        const grd = g.createRadialGradient(256, 256, 0, 256, 256, 256);
        stops.forEach(([o, col]) => grd.addColorStop(o, col));
        g.fillStyle = grd;
        g.fillRect(0, 0, 512, 512);
        const t = new THREE.CanvasTexture(c);
        t.colorSpace = THREE.SRGBColorSpace;
        return t;
      }
      const falloff = new THREE.Mesh(
        new THREE.PlaneGeometry(40, 40),
        new THREE.MeshBasicMaterial({
          map: radialTexture([
            [0.0, "rgba(2,5,9,0)"],
            [0.14, "rgba(2,5,9,0.35)"],
            [0.32, "rgba(2,5,9,0.92)"],
            [0.5, "rgba(2,5,9,1)"],
          ]),
          transparent: true,
          depthWrite: false,
        }),
      );
      falloff.rotation.x = -Math.PI / 2;
      falloff.position.y = 0.002;
      scene.add(falloff);
      const pool = new THREE.Mesh(
        new THREE.PlaneGeometry(14, 14),
        new THREE.MeshBasicMaterial({
          map: radialTexture([
            [0.0, "rgba(99,199,255,0.55)"],
            [0.35, "rgba(61,169,255,0.18)"],
            [1.0, "rgba(6,26,46,0)"],
          ]),
          transparent: true,
          depthWrite: false,
          blending: THREE.AdditiveBlending,
        }),
      );
      pool.rotation.x = -Math.PI / 2;
      pool.position.y = 0.004;
      scene.add(pool);

      // ---------- particles: seeded, drift derived from time ----------
      function mulberry32(a) {
        return function () {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const rnd = mulberry32(20261021);
      const N = 320;
      const base = new Float32Array(N * 3);
      const vel = new Float32Array(N * 2);
      for (let i = 0; i < N; i++) {
        base[i * 3] = (rnd() - 0.5) * 18;
        base[i * 3 + 1] = rnd() * 6.5;
        base[i * 3 + 2] = (rnd() - 0.5) * 18;
        vel[i * 2] = 0.05 + rnd() * 0.12;
        vel[i * 2 + 1] = rnd() * Math.PI * 2;
      }
      const pGeo = new THREE.BufferGeometry();
      const pPos = new Float32Array(N * 3);
      pGeo.setAttribute("position", new THREE.BufferAttribute(pPos, 3));
      const dot = document.createElement("canvas");
      dot.width = dot.height = 64;
      const dg = dot.getContext("2d");
      const dgr = dg.createRadialGradient(32, 32, 0, 32, 32, 32);
      dgr.addColorStop(0, "rgba(255,255,255,1)");
      dgr.addColorStop(0.35, "rgba(170,225,255,0.6)");
      dgr.addColorStop(1, "rgba(99,199,255,0)");
      dg.fillStyle = dgr;
      dg.fillRect(0, 0, 64, 64);
      const particles = new THREE.Points(
        pGeo,
        new THREE.PointsMaterial({
          size: 0.05,
          map: new THREE.CanvasTexture(dot),
          color: 0xa9ddf7,
          transparent: true,
          opacity: 0.7,
          depthWrite: false,
          blending: THREE.AdditiveBlending,
          sizeAttenuation: true,
        }),
      );
      scene.add(particles);

      // ---------- PPF paint: shader wipe between two films with a glowing application edge ----------
      const PAINTS = [
        { hex: 0x9aa1a8, met: 0.85, rough: 0.32, cc: 1.0 }, // 0 factory silver (before film)
        { hex: 0x0d0e10, met: 0.2, rough: 0.55, cc: 0.25 }, // 1 satin black
        { hex: 0x6b7075, met: 0.15, rough: 0.36, cc: 1.0 }, // 2 grey
        { hex: 0xe6e9ec, met: 0.3, rough: 0.24, cc: 1.0 }, // 3 pearl white
        { hex: 0x6fbfe8, met: 0.55, rough: 0.28, cc: 1.0 }, // 4 ice blue
        { hex: 0x123a7a, met: 0.8, rough: 0.3, cc: 1.0 }, // 5 deep navy
      ];
      // [start, end, from, to]
      const WIPES = [
        [4.2, 6.9, 0, 1],
        [8.85, 9.75, 1, 2],
        [9.95, 10.85, 2, 3],
        [11.05, 11.95, 3, 4],
        [12.15, 13.05, 4, 5],
        [13.75, 14.55, 5, 4],
        [14.95, 15.75, 4, 5],
      ];
      const U = {
        uColA: { value: new THREE.Color(PAINTS[0].hex) },
        uColB: { value: new THREE.Color(PAINTS[0].hex) },
        uRoA: { value: 0.3 },
        uRoB: { value: 0.3 },
        uMeA: { value: 0.8 },
        uMeB: { value: 0.8 },
        uCcA: { value: 1 },
        uCcB: { value: 1 },
        uP: { value: -1 },
        uSoft: { value: 0.006 },
        uBand: { value: 0.008 },
        uGlow: { value: 0 },
        uGlowCol: { value: new THREE.Color(0x8fd6ff).multiplyScalar(4) },
        uZMin: { value: -2.3 },
        uZMax: { value: 2.3 },
      };
      const bodyMat = new THREE.MeshPhysicalMaterial({
        color: 0xffffff,
        metalness: 0.8,
        roughness: 0.3,
        clearcoat: 1.0,
        clearcoatRoughness: 0.03,
      });
      bodyMat.onBeforeCompile = (sh) => {
        Object.assign(sh.uniforms, U);
        sh.vertexShader = sh.vertexShader
          .replace("#include <common>", "#include <common>\nvarying vec3 vSweepPos;")
          .replace(
            "#include <worldpos_vertex>",
            "#include <worldpos_vertex>\nvSweepPos = (modelMatrix * vec4(transformed, 1.0)).xyz;",
          );
        sh.fragmentShader = sh.fragmentShader
          .replace(
            "#include <common>",
            `#include <common>
            varying vec3 vSweepPos;
            uniform vec3 uColA; uniform vec3 uColB; uniform vec3 uGlowCol;
            uniform float uRoA; uniform float uRoB; uniform float uMeA; uniform float uMeB;
            uniform float uCcA; uniform float uCcB; uniform float uP; uniform float uSoft;
            uniform float uBand; uniform float uGlow; uniform float uZMin; uniform float uZMax;`,
          )
          .replace(
            "#include <color_fragment>",
            `#include <color_fragment>
            float sweepU = (vSweepPos.z - uZMin) / (uZMax - uZMin);
            float sweepF = 1.0 - smoothstep(uP - uSoft, uP + uSoft, sweepU);
            diffuseColor.rgb = mix(uColA, uColB, sweepF);`,
          )
          .replace("#include <roughnessmap_fragment>", "#include <roughnessmap_fragment>\nroughnessFactor = mix(uRoA, uRoB, sweepF);")
          .replace("#include <metalnessmap_fragment>", "#include <metalnessmap_fragment>\nmetalnessFactor = mix(uMeA, uMeB, sweepF);")
          .replace(
            "#include <emissivemap_fragment>",
            `#include <emissivemap_fragment>
            float sweepD = (sweepU - uP) / uBand;
            totalEmissiveRadiance += uGlowCol * uGlow * (exp(-sweepD * sweepD) + 0.06 * exp(-sweepD * sweepD / 25.0));`,
          )
          .replace(
            "#include <lights_physical_fragment>",
            "#include <lights_physical_fragment>\n#ifdef USE_CLEARCOAT\nmaterial.clearcoat = saturate(mix(uCcA, uCcB, sweepF));\n#endif",
          );
      };

      function setPaintPair(a, b) {
        const A = PAINTS[a];
        const B = PAINTS[b];
        U.uColA.value.setHex(A.hex);
        U.uColB.value.setHex(B.hex);
        U.uRoA.value = A.rough;
        U.uRoB.value = B.rough;
        U.uMeA.value = A.met;
        U.uMeB.value = B.met;
        U.uCcA.value = A.cc;
        U.uCcB.value = B.cc;
      }
      const smooth = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x));
      const inOutSine = (x) => -(Math.cos(Math.PI * Math.min(Math.max(x, 0), 1)) - 1) / 2;
      const outCubic = (x) => 1 - Math.pow(1 - Math.min(Math.max(x, 0), 1), 3);

      function paintAt(t) {
        let active = null;
        let last = -1;
        for (let i = 0; i < WIPES.length; i++) {
          if (t >= WIPES[i][0]) last = i;
        }
        if (last >= 0 && t < WIPES[last][1]) active = WIPES[last];
        if (active) {
          const [s, e, from, to] = active;
          const p = inOutSine((t - s) / (e - s));
          setPaintPair(from, to);
          U.uP.value = -0.06 + p * 1.12;
          U.uGlow.value = smooth(p / 0.08) * (1 - smooth((p - 0.9) / 0.1));
        } else {
          const settled = last >= 0 ? WIPES[last][3] : 0;
          setPaintPair(settled, settled);
          U.uP.value = 2;
          U.uGlow.value = 0;
        }
      }

      // ---------- camera shots (one canvas, hard cuts masked by the HTML light sweep) ----------
      const deg = Math.PI / 180;
      function orbit(aDeg, r, h, ty) {
        return { pos: new THREE.Vector3(Math.sin(aDeg * deg) * r, h, Math.cos(aDeg * deg) * r), target: new THREE.Vector3(0, ty, 0) };
      }
      const lerp = (a, b, q) => a + (b - a) * q;
      function shotFor(t) {
        if (t < CUT_B) {
          const q = inOutSine(t / CUT_B);
          return { ...orbit(lerp(212, 262, q), lerp(12.0, 11.0, q), lerp(0.7, 1.1, q), 0.6), shift: 250 };
        }
        if (t < CUT_C) {
          const q = inOutSine((t - CUT_B) / (CUT_C - CUT_B));
          return { ...orbit(lerp(142, 160, q), lerp(10.8, 9.8, q), lerp(0.55, 0.72, q), 0.62), shift: 290 };
        }
        if (t < CUT_D) {
          const q = inOutSine((t - CUT_C) / (CUT_D - CUT_C));
          return { ...orbit(lerp(93, 88, q), lerp(13.4, 12.8, q), lerp(2.4, 2.1, q), 0.45), shift: 210 };
        }
        const q = outCubic((t - CUT_D) / (20 - CUT_D));
        return { ...orbit(lerp(214, 204, q), lerp(10.4, 9.0, q), lerp(0.85, 0.7, q), 0.6), shift: 250 };
      }

      function renderAt(t) {
        const shot = shotFor(t);
        camera.position.copy(shot.pos);
        camera.lookAt(shot.target);
        // shift the frame so the car sits in the lower half, under the Arabic titles
        camera.setViewOffset(W, H, 0, -shot.shift, W, H);

        // light reveal
        const lit = smooth((t - 0.35) / 2.4);
        scene.environmentIntensity = 0.04 + 0.96 * lit;
        pool.material.opacity = 0.25 + 0.75 * lit;
        const ls = Math.min(Math.max((t - 0.2) / 2.8, 0), 1);
        sweepLight.position.set(lerp(-8, 8, inOutSine(ls)), 6.2, 3.5);
        sweepLight.intensity = 9 * Math.sin(Math.PI * ls);

        paintAt(t);

        for (let i = 0; i < N; i++) {
          const v = vel[i * 2];
          const ph = vel[i * 2 + 1];
          pPos[i * 3] = base[i * 3] + Math.sin(ph + t * 0.35) * 0.25;
          pPos[i * 3 + 1] = (base[i * 3 + 1] + t * v) % 6.5;
          pPos[i * 3 + 2] = base[i * 3 + 2] + Math.cos(ph + t * 0.28) * 0.25;
        }
        pGeo.attributes.position.needsUpdate = true;

        renderer.render(scene, camera);
      }

      // ---------- load the car (unbadged studio model) ----------
      const draco = new DRACOLoader();
      draco.setDecoderPath("./assets/vendor/three/jsm/libs/draco/gltf/");
      const loader = new GLTFLoader();
      loader.setDRACOLoader(draco);

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["rek-car"] = new Promise((resolve) => {
        loader.load("./assets/models/gt_coupe_unbadged.glb", (gltf) => {
          const car = gltf.scene.children[0];
          const detailsMat = new THREE.MeshStandardMaterial({ color: 0xd6dbe0, metalness: 1.0, roughness: 0.32 });
          const glassMat = new THREE.MeshPhysicalMaterial({
            color: 0x0b0f14,
            metalness: 0.1,
            roughness: 0.04,
            clearcoat: 1,
            transparent: true,
            opacity: 0.88,
          });
          const body = car.getObjectByName("body");
          body.material = bodyMat;
          ["rim_fl", "rim_fr", "rim_rr", "rim_rl", "trim"].forEach((n) => {
            const o = car.getObjectByName(n);
            if (o) o.material = detailsMat;
          });
          const glass = car.getObjectByName("glass");
          if (glass) glass.material = glassMat;

          const aoTex = new THREE.TextureLoader().load("./assets/models/car_ao.png", () => {
            scene.add(car);
            car.updateMatrixWorld(true);
            const bb = new THREE.Box3().setFromObject(body);
            U.uZMin.value = bb.min.z;
            U.uZMax.value = bb.max.z;
            renderer.compile(scene, camera);
            renderAt(window.__hfThreeTime || 0);
            resolve();
          });
          const shadow = new THREE.Mesh(
            new THREE.PlaneGeometry(0.655 * 4, 1.3 * 4),
            new THREE.MeshBasicMaterial({
              map: aoTex,
              blending: THREE.MultiplyBlending,
              toneMapped: false,
              transparent: true,
              premultipliedAlpha: true,
            }),
          );
          shadow.rotation.x = -Math.PI / 2;
          shadow.position.y = 0.006;
          shadow.renderOrder = 2;
          car.add(shadow);
        });
      });

      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      renderAt(window.__hfThreeTime || 0);
    </script>
  </body>
</html>
